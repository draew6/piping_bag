[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "piping-bag"
version = "0.6.1"
description = "Unified CLI for pgschema migrations and SQLC code generation"
requires-python = ">=3.13"
dependencies = [
    "asyncpg",
    "pydantic-settings",
    "typer[all]",
]

[project.scripts]
pb = "piping_bag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"piping_bag" = ["templates/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
